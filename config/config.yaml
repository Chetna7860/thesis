data:
  breakhis:
    path: /kaggle/input/datasets/ambarish/breakhis/BreaKHis_v1/BreaKHis_v1/histology_slides/breast
    use: true
    magnification: [40, 100, 200, 400]
  inbreast:
    path: /kaggle/input/datasets/ramanathansp20/inbreast-dataset
    use: true
  mias:
    path: /kaggle/input/datasets/kmader/mias-mammography
    use: true

training:
  batch_size: 32
  epochs: 50
  early_stop_patience: 10
  learning_rate: 0.001
  min_lr: 1.0e-6
  weight_decay: 0.0001
  num_workers: 2
  mixed_precision: true
  label_smoothing: 0.1
  k_folds: 0
  val_split: 0.15
  test_split: 0.10
  seed: 42
  gradient_clip: 1.0

model:
  name: ensemble
  pretrained: true
  num_classes: 2
  dropout: 0.3
  use_ensemble: true
  ensemble_models:
    - resnet50
    - densenet121

augmentation:
  img_size: 224
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 0.5
  rotation: 30
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.1

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  plot_dir: outputs/plots
  model_dir: outputs/models
  gradcam_dir: outputs/gradcam
